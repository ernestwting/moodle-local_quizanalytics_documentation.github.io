name: Sync docs from local_quizanalytics

# Keeps this site's chapter pages in sync with moodle-local_quizanalytics's
# docs/guide/*.md, its own working source of documentation. Runs on a
# schedule (that repo is a separate GitHub repo -- it has no way to push a
# webhook into this one) and can be triggered by hand from the Actions tab.
# Needs no secrets: the source repo is public (read via raw.githubusercontent.com,
# no auth), and this workflow only ever writes back to its own repo using
# the GITHUB_TOKEN Actions provides automatically.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Run sync
        run: python3 scripts/sync_docs.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "docs-sync-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Sync content from moodle-local_quizanalytics docs/guide/"
            git push
          else
            echo "No changes to commit."
          fi
